[package]
name = "brainnote-desktop"
version = "1.0.0"
description = "Brainnote AI Commercial Knowledge Companion — Desktop Client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
